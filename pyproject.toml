[project]
name = "readygate"
version = "0.1.0"
description = "Probe OpenAI-compatible tool-call responses, retry supported request repairs, and report per-layer validation results."
readme = "README.md"
license = "MIT"
authors = [{ name = "SuperMarioYL" }]
requires-python = ">=3.12"
keywords = ["llm", "agents", "tool-calling", "qwen", "deepseek", "glm", "kimi", "openai", "readiness"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.scripts]
readygate = "readygate.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/readygate"
Issues = "https://github.com/SuperMarioYL/readygate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["readygate"]

[tool.hatch.build.targets.sdist]
include = ["readygate", "tests", "README.md", "README.en.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
